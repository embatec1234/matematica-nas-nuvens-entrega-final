<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Matemática nas Nuvens">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA9F5"/>
      <stop offset="1" stop-color="#9ADCFF"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F3FF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFE66D"/>
      <stop offset="1" stop-color="#FFB800"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- sol -->
    <g>
      <g stroke="#FFD93D" stroke-width="16" stroke-linecap="round" opacity=".9">
        <path d="M392 52v26M392 182v26M327 130h-26M483 130h-26M346 84l-18-18M438 176l18 18M438 84l18-18M346 176l-18 18" transform="translate(0 0)"/>
      </g>
      <circle cx="392" cy="130" r="52" fill="url(#sun)"/>
    </g>

    <!-- nuvem pequena ao fundo -->
    <g fill="#FFFFFF" opacity=".75">
      <rect x="40" y="120" width="120" height="34" rx="17"/>
      <circle cx="78" cy="116" r="26"/>
      <circle cx="116" cy="108" r="30"/>
    </g>

    <!-- sombra da nuvem -->
    <ellipse cx="256" cy="448" rx="170" ry="14" fill="#233256" opacity=".12"/>

    <!-- nuvem principal -->
    <g>
      <path d="M118 420
               C60 420 36 372 56 336
               C70 310 98 304 122 308
               C122 250 170 212 224 220
               C244 168 308 156 348 192
               C372 168 424 176 436 222
               C486 224 508 278 484 322
               C500 372 470 420 420 420 Z"
            fill="#233256" opacity=".14" transform="translate(0 10)"/>
      <path d="M118 420
               C60 420 36 372 56 336
               C70 310 98 304 122 308
               C122 250 170 212 224 220
               C244 168 308 156 348 192
               C372 168 424 176 436 222
               C486 224 508 278 484 322
               C500 372 470 420 420 420 Z"
            fill="url(#cloud)"/>
    </g>

    <!-- sinal de + (roxo) -->
    <g stroke="#6F4CDE" stroke-width="30" stroke-linecap="round">
      <path d="M190 330h96M238 282v96"/>
    </g>
    <!-- sinal de = (coral) -->
    <g stroke="#FF6F6F" stroke-width="22" stroke-linecap="round">
      <path d="M332 312h60M332 352h60"/>
    </g>

    <!-- brilhos -->
    <g fill="#FFFFFF">
      <path d="M92 250l8 18 18 8-18 8-8 18-8-18-18-8 18-8z" opacity=".9"/>
    </g>
  </g>
</svg>
